name: Commitly Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: commitly-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: https://data.forgejo.org/actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install cache compression
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends zstd

      - name: Restore Gradle cache
        id: gradle-cache
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-${{ runner.arch }}-
            gradle-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Report Gradle cache status
        run: |
          echo "Gradle cache hit: ${{ steps.gradle-cache.outputs.cache-hit }}"

      - name: Build commitly artifacts
        run: |
          if ! ./gradlew build --build-cache --max-workers=1; then
            echo "Initial build failed; retrying once in a fresh Gradle process"
            ./gradlew --stop || true
            ./gradlew build --build-cache --max-workers=1
          fi

      - name: Verify Java 8 legacy artifact
        run: |
          legacy_jar="$(find viaforge-mc189/build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$legacy_jar"
          major_version="$(javap -verbose -classpath "$legacy_jar" com.viaversion.viaforge.mixin.MixinLoader | awk '/major version:/ { print $3 }')"
          test "$major_version" = 52

      - name: Stage release artifacts
        env:
          COMMIT_SHA: ${{ forgejo.sha }}
          COMMIT_MESSAGE: ${{ forgejo.event.head_commit.message }}
        run: |
          mkdir -p dist/release
          find viaforge-mc*/build/libs -maxdepth 1 -type f -name '*.jar' -exec cp '{}' dist/release/ \;
          printf 'Automated build of commit `%s`.\n\n%s\n' "$COMMIT_SHA" "$COMMIT_MESSAGE" > dist/release-notes.md

      - name: Create Forgejo commitly release
        uses: https://data.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: ${{ forgejo.server_url }}
          repo: ${{ forgejo.repository }}
          token: ${{ forgejo.token }}
          tag: commitly-${{ forgejo.sha }}
          title: Commitly ${{ forgejo.sha }}
          sha: ${{ forgejo.sha }}
          release-dir: dist/release
          release-notes-file: dist/release-notes.md
          prerelease: true
          override: true
